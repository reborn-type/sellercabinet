services:
  db:
    image: postgres:17
    container_name: sellercabinet-db 
    environment: 
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: 
      - "5433:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seller_user -d sellercabinet"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  app: 
    build: . 
    container_name: sellercabinet-app
    depends_on:
      db: 
        condition: service_healthy
    environment: 
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sellercabinet
      SPRING_DATASOURCE_USERNAME: seller_user
      SPRING_DATASOURCE_PASSWORD: seller_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
    ports:
      - "8080:8080"
    restart: on-failure

volumes:
  pgdata: