server:
  port: 8085

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8080
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**

        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem