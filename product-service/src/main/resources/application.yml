server:
  port: 8082
spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/products}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:user}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.handler: true

    consumer:
      group-id: product-service
      properties:
        spring.json.trusted.packages: "com.example.events"
        key-serializer: org.apache.kafka.common.serialization.StringDeserializer
        values-deserializer: org.springframework.kafka.support.serializer.JsonDeserialization
        properties:
          spring.json.trusted.packages: "com.example.events"
          spring.json.use.type.handlers: true
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public.pem
